name: Refresh profile activity

on:
  schedule:
    - cron: '17 1 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/activity.yml'
      - '.design/fetch-activity.mjs'
      - '.design/render.mjs'
      - 'package.json'
      - 'package-lock.json'

permissions:
  contents: write

concurrency:
  group: profile-activity
  cancel-in-progress: false

jobs:
  activity:
    if: github.repository == 'AhmadNurHidayat-23/AhmadNurHidayat-23'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Fetch real contribution calendar
        run: npm run refresh:activity
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Render activity only
        run: npm run build:activity
      - name: Publish refreshed activity
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .design/data/activity.json assets/motion/activity.gif assets/motion/activity.svg assets/motion/activity-mobile.gif assets/motion/activity-mobile.svg
          if ! git diff --cached --quiet; then
            git commit -m 'chore: refresh authentic GitHub activity'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
